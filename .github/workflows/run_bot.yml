name: NUMBER BOTMAN 24/7 Always-Online Bot Runner

on:
  push:
    branches: [ main ]          # Auto-starts on every push to main
  workflow_dispatch:             # Allows manual trigger from GitHub UI
  schedule:
    # Overlapping 3-hour cron triggers guarantee 24/7 uptime without manual restart
    - cron: '0 */3 * * *'

# Only ONE bot instance ever runs. New run cancels the old one instantly.
concurrency:
  group: number-botman-single-instance
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    name: Run NUMBER BOTMAN 24/7
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cancel Any Other Running Instances
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Cancelling any other active runs of this workflow..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              if str(r['id']) != '${{ github.run_id }}':
                  print(r['id'])
          " | while read r_id; do
            echo "  🛑 Cancelling old run #$r_id..."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id/cancel" || true
          done
          echo "✅ Cleanup done."

      - name: Clear Old Completed Workflow History
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🧹 Deleting old completed/cancelled workflow run history..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&per_page=20" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              print(r['id'])
          " | while read r_id; do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id" || true
          done
          echo "✅ History cleaned."

      # Restore database + number stocks from cache so all data persists across runs
      - name: Restore Persistent Database from Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bot4_database.db
            country_stocks/
          key: bot4-database-persistent
          restore-keys: |
            bot4-database-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          pip install --quiet --upgrade pip
          pip install --quiet \
            python-telegram-bot==22.1 \
            python-dotenv \
            httpx \
            aiohttp \
            requests
          echo "✅ All dependencies installed."

      - name: Validate Required Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          echo "🔍 Checking required GitHub Secrets..."
          MISSING=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && MISSING="${MISSING}\n  - TELEGRAM_BOT_TOKEN"
          if [ -n "$MISSING" ]; then
            echo -e "❌ Missing required secrets:${MISSING}"
            echo "Please configure these in Repository Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -f "bot4_database.db" ]; then
            echo "✅ Persistent database restored from cache — all numbers and users retained."
          else
            echo "ℹ️ No cache found — fresh database will be created on first run."
          fi
          if [ -d "country_stocks" ]; then
            echo "✅ Country stock files restored from cache."
          fi
          echo "✅ All required secrets present!"

      - name: Run NUMBER BOTMAN (Auto-Recovery & Crash Protection)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DB_FILE: ${{ github.workspace }}/bot4_database.db
          STARTUP_TYPE: ${{ github.event_name }}
          SESSION_TIMEOUT: "16200"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "========================================"
          echo "  NUMBER BOTMAN — Starting Up (24/7)"
          echo "  Trigger : ${{ github.event_name }}"
          echo "  DB Path : $DB_FILE"
          echo "========================================"

          # Session limit: 4.5 hours (16200s), after which bot exits cleanly with code 0
          END_TIME=$((SECONDS + 16200))

          while [ $SECONDS -lt $END_TIME ]; do
            echo "⚡ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Launching bot.py..."
            python bot.py
            EXIT_CODE=$?

            # Exit code 0 = clean session handover (proceed to save & next run)
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Clean session handover signal received (exit 0)."
              break
            fi

            # Exit code 1 = fatal missing secrets — don't retry in infinite loop
            if [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Fatal config error (exit 1). Halting — check your secrets!"
              exit 1
            fi

            # Exit code 2 or any other = transient network/API error — auto-restart in 3s
            echo "⚠️ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Bot stopped (exit: $EXIT_CODE). Auto-restarting in 3s..."
            sleep 3
          done

          echo "⏱️ 4.5-hour session complete. Saving database and triggering next run..."

      # Always save database before runner is destroyed — even if bot crashed
      - name: Save Persistent Database to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot4_database.db
            country_stocks/
          key: bot4-database-persistent

      - name: Self-Trigger Next Run (Zero Downtime Restart)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering next bot session immediately to avoid downtime..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
            -d '{"ref":"main"}')

          if [ "$HTTP_CODE" != "204" ] && [ -n "$GIST_TOKEN" ]; then
            echo "ℹ️ Retrying dispatch with auxiliary token..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
              -d '{"ref":"main"}')
          fi

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Next run triggered! NUMBER BOTMAN continues without downtime."
          else
            echo "ℹ️ Self-trigger dispatch response: HTTP $HTTP_CODE (continuous 3-hour cron will seamlessly keep the bot running 24/7)."
          fi
