name: NUMBER BOTMAN 24/7 Always-Online Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      is_handover:
        description: 'Internal zero-restart handover flag (true/false)'
        required: false
        default: 'false'
  schedule:
    # Backup safety net — fires every 6h ONLY if bot ever stops
    - cron: '0 */6 * * *'

# Only ONE bot instance ever runs. New push/handover cancels old one instantly so updates apply with ZERO delay.
# Scheduled backup uses a unique group so it NEVER cancels an active running bot!
concurrency:
  group: number-botman-${{ github.event_name == 'schedule' && github.run_id || 'single-instance' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    name: Run NUMBER BOTMAN 24/7
    runs-on: ubuntu-latest
    # GitHub hard limit is 6h (360 min). We use 358 to leave a 2-min safety buffer.
    timeout-minutes: 358

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scheduled Safety-Net Check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Checking if bot is already running in 24/7 session..."
          ACTIVE_RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          active = [r for r in runs if str(r.get('id')) != '${{ github.run_id }}']
          print(len(active))
          ")
          if [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "✅ Bot is already running healthy in 24/7 session ($ACTIVE_RUNS active runner). Backup schedule exiting cleanly without interrupting."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
            exit 0
          fi
          echo "⚠️ No active runner detected! Scheduled backup will start the bot now."

      # ─────────────────────────────────────────────────────────────────
      # Restore the database & stock pools from cache FIRST
      # BEFORE any cancellation or history cleanup!
      # ─────────────────────────────────────────────────────────────────
      - name: Restore Persistent Database from Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bot4_database.db
            bot4_database.db-wal
            bot4_database.db-shm
            country_stocks/
            bot_data.json
            otp_group_link.txt
          key: bot4-database-persistent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot4-database-persistent-
            bot4-database-

      - name: Cancel Any Other Running Instances
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=10" \
            | python3 -c "
          import sys, json, urllib.request
          token = '$GH_TOKEN'
          repo = '${{ github.repository }}'
          current_id = '${{ github.run_id }}'
          try:
              data = json.load(sys.stdin)
              for r in data.get('workflow_runs', []):
                  r_id = str(r.get('id'))
                  if r_id != current_id:
                      req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{r_id}/cancel',
                          method='POST',
                          headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
                      )
                      try:
                          urllib.request.urlopen(req, timeout=3)
                          print(f'🛑 Cancelled older run #{r_id}')
                      except Exception:
                          pass
          except Exception:
              pass
          " || true
          echo "✅ Active runner check complete."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --quiet -r requirements.txt
          echo "✅ Dependencies ready."

      - name: Validate Required Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo "❌ Missing: TELEGRAM_BOT_TOKEN" && exit 1
          [ -f "bot4_database.db" ] && echo "✅ DB cache restored." || echo "ℹ️ Fresh DB will be created."
          [ -d "country_stocks" ] && echo "✅ Country stocks cache restored."
          echo "✅ All secrets present."

      - name: Run NUMBER BOTMAN (Auto-Recovery & Crash Protection)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          THIRDWAVE_API_KEY: ${{ secrets.THIRDWAVE_API_KEY }}
          THIRDWAVE_BASE_URL: ${{ secrets.THIRDWAVE_BASE_URL }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SECONDARY_GROUP_CHAT_ID: ${{ secrets.SECONDARY_GROUP_CHAT_ID }}
          OTPMAN_API_KEY: ${{ secrets.OTPMAN_API_KEY }}
          OTPMAN_BASE_URL: ${{ secrets.OTPMAN_BASE_URL }}
          OTPMAN2_API_KEY: ${{ secrets.OTPMAN2_API_KEY }}
          OTPMAN2_BASE_URL: ${{ secrets.OTPMAN2_BASE_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DB_FILE: ${{ github.workspace }}/bot4_database.db
          STARTUP_TYPE: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          IS_HANDOVER: ${{ github.event.inputs.is_handover || 'false' }}
          SESSION_TIMEOUT: "19500"
          POLL_INTERVAL_SECONDS: ${{ secrets.POLL_INTERVAL_SECONDS || '4.0' }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "========================================"
          echo "  NUMBER BOTMAN — Starting Up (24/7)"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  DB Path  : $DB_FILE"
          echo "  Session  : 5h 25min (19500s) — GitHub limit: 6h"
          echo "========================================"

          # 19500s = 5h 25min. Overhead (setup + save + trigger) ~10min.
          # Total ~5h 35min — safely within the 5h 58min (358min) job limit.
          END_TIME=$((SECONDS + 19500))

          # Instantly exit when GitHub sends cancellation signals (SIGTERM/SIGINT)
          trap "echo '🛑 Immediate cancellation signal received. Halting runner.'; exit 0" SIGTERM SIGINT

          # Continuous background cleaner: deletes completed runs every 120s without blocking startup
          (
            CLEAN_TOKEN="${{ github.token }}"
            CLEAN_ALT="${{ secrets.PAT || secrets.GH_TOKEN || secrets.GIST_TOKEN }}"
            while true; do
              sleep 120
              curl -s -H "Authorization: Bearer $CLEAN_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50" \
                | python3 -c "
              import sys, json
              runs = json.load(sys.stdin).get('workflow_runs', [])
              for r in runs:
                  if str(r.get('id')) != '${{ github.run_id }}' and r.get('status') == 'completed':
                      print(r['id'])
              " 2>/dev/null | while read r_id; do
                DEL_RES=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $CLEAN_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id")
                if [ "$DEL_RES" != "204" ] && [ -n "$CLEAN_ALT" ]; then
                  curl -s -X DELETE -H "Authorization: Bearer $CLEAN_ALT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id" >/dev/null 2>&1 || true
                fi
              done
            done
          ) &

          while true; do
            REMAINING=$((END_TIME - SECONDS))

            # Exit if less than 90 seconds remain — guarantees save & trigger steps can run
            if [ $REMAINING -lt 90 ]; then
              echo "⏱️ Session window ending. Exiting cleanly for save & self-trigger."
              break
            fi

            echo "⚡ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Launching bot.py... (${REMAINING}s remaining)"
            python bot.py
            EXIT_CODE=$?

            # Exit 0 = clean handover signal
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Clean session handover (exit 0)."
              break
            fi

            # Exit 1 = fatal config error — stop immediately
            if [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Fatal config error (exit 1). Halting."
              exit 1
            fi

            # Exit > 128 = killed by GitHub Actions cancel-in-progress (SIGINT=130, SIGTERM=143)
            # Must exit immediately so the newly pushed workflow run starts with ZERO delay!
            if [ $EXIT_CODE -gt 128 ]; then
              echo "🛑 Process terminated by GitHub cancellation ($EXIT_CODE). Exiting loop immediately."
              break
            fi

            # Any other exit = transient crash — auto-restart after 3s
            echo "⚠️ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Bot stopped (exit: $EXIT_CODE). Restarting in 3s..."
            sleep 3
          done

          echo "⏱️ Session complete. Handing off to save & next-run trigger..."

      - name: Pre-Save Database Checkpoint
        if: always()
        run: |
          python3 -c "
          import sqlite3, os
          dbs = ['bot4_database.db']
          if os.path.exists('country_stocks'):
              for f in os.listdir('country_stocks'):
                  if f.endswith('.db'):
                      dbs.append(os.path.join('country_stocks', f))
          for f in dbs:
              if os.path.exists(f):
                  try:
                      with sqlite3.connect(f) as conn:
                          conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                  except Exception as e:
                      pass
          print('✅ WAL checkpointed successfully before cache save.')
          " || true

      - name: Save Persistent Database to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot4_database.db
            bot4_database.db-wal
            bot4_database.db-shm
            country_stocks/
            bot_data.json
            otp_group_link.txt
          key: bot4-database-persistent-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Self-Trigger Next Run (Zero Downtime Restart)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering next session immediately..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_handover":"true"}}')

          if [ "$HTTP_CODE" != "204" ] && [ -n "$GIST_TOKEN" ]; then
            echo "ℹ️ Retrying with auxiliary token..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
              -d '{"ref":"main","inputs":{"is_handover":"true"}}')
          fi

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Next run triggered! NUMBER BOTMAN is 24/7 with zero downtime."
          else
            echo "⚠️ Self-trigger HTTP $HTTP_CODE — backup cron (every 6h) will restart if needed."
          fi
