name: NUMBER BOTMAN 24/7 Always-Online Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      is_handover:
        description: 'Internal zero-restart handover flag (true/false)'
        required: false
        default: 'false'
  schedule:
    # Backup safety net — fires every 6h if self-trigger ever fails
    - cron: '0 */6 * * *'

# Only ONE bot instance ever runs. New run cancels the old one instantly.
concurrency:
  group: number-botman-single-instance
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    name: Run NUMBER BOTMAN 24/7
    runs-on: ubuntu-latest
    # GitHub hard limit is 6h (360 min). We use 358 to leave a 2-min safety buffer.
    timeout-minutes: 358

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cancel Any Other Running Instances
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              if str(r['id']) != '${{ github.run_id }}':
                  print(r['id'])
          " | while read r_id; do
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id/cancel" || true
          done
          echo "✅ Old runs cancelled."

      - name: Clear Old Completed Workflow History
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&per_page=20" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              print(r['id'])
          " | while read r_id; do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$r_id" || true
          done
          echo "✅ History cleaned."

      - name: Restore Persistent Database from Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bot4_database.db
            bot4_database.db-wal
            bot4_database.db-shm
            country_stocks/
            otp_group_link.txt
          key: bot4-database-persistent-${{ github.run_id }}
          restore-keys: |
            bot4-database-persistent-
            bot4-database-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-bot4-ptb22-v1
          restore-keys: pip-bot4-

      - name: Install Dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet \
            python-telegram-bot==22.1 \
            python-dotenv \
            httpx \
            aiohttp \
            requests
          echo "✅ Dependencies ready."

      - name: Validate Required Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && echo "❌ Missing: TELEGRAM_BOT_TOKEN" && exit 1
          [ -f "bot4_database.db" ] && echo "✅ DB cache restored." || echo "ℹ️ Fresh DB will be created."
          [ -d "country_stocks" ] && echo "✅ Country stocks cache restored."
          echo "✅ All secrets present."

      - name: Run NUMBER BOTMAN (Auto-Recovery & Crash Protection)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DB_FILE: ${{ github.workspace }}/bot4_database.db
          STARTUP_TYPE: ${{ github.event_name }}
          IS_HANDOVER: ${{ github.event.inputs.is_handover || 'false' }}
          SESSION_TIMEOUT: "19500"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "========================================"
          echo "  NUMBER BOTMAN — Starting Up (24/7)"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  DB Path  : $DB_FILE"
          echo "  Session  : 5h 25min (19500s) — GitHub limit: 6h"
          echo "========================================"

          # 19500s = 5h 25min. Overhead (setup + save + trigger) ~10min.
          # Total ~5h 35min — safely within the 5h 58min (358min) job limit.
          END_TIME=$((SECONDS + 19500))

          while true; do
            REMAINING=$((END_TIME - SECONDS))

            # Exit if less than 90 seconds remain — guarantees save & trigger steps can run
            if [ $REMAINING -lt 90 ]; then
              echo "⏱️ Session window ending. Exiting cleanly for save & self-trigger."
              break
            fi

            echo "⚡ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Launching bot.py... (${REMAINING}s remaining)"
            python bot.py
            EXIT_CODE=$?

            # Exit 0 = clean handover signal
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Clean session handover (exit 0)."
              break
            fi

            # Exit 1 = fatal config error — stop immediately
            if [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Fatal config error (exit 1). Halting."
              exit 1
            fi

            # Any other exit = transient crash — auto-restart after 3s
            echo "⚠️ [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Bot stopped (exit: $EXIT_CODE). Restarting in 3s..."
            sleep 3
          done

          echo "⏱️ Session complete. Handing off to save & next-run trigger..."

      - name: Save Persistent Database to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot4_database.db
            bot4_database.db-wal
            bot4_database.db-shm
            country_stocks/
            otp_group_link.txt
          key: bot4-database-persistent-${{ github.run_id }}

      - name: Self-Trigger Next Run (Zero Downtime Restart)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering next session immediately..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_handover":"true"}}')

          if [ "$HTTP_CODE" != "204" ] && [ -n "$GIST_TOKEN" ]; then
            echo "ℹ️ Retrying with auxiliary token..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot.yml/dispatches" \
              -d '{"ref":"main","inputs":{"is_handover":"true"}}')
          fi

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Next run triggered! NUMBER BOTMAN is 24/7 with zero downtime."
          else
            echo "⚠️ Self-trigger HTTP $HTTP_CODE — backup cron (every 6h) will restart if needed."
          fi
